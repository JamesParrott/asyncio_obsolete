    name: Test ${{ matrix.rev-dep.package_name }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Download sdist
      run: 'pip download --no-binary=:all: --no-deps --dest . ${{ matrix.rev-dep.package_name }}'
      
    - name: Extract sdist
      run: tar -xzf *.tar.gz --strip-components=1 -C .


    - name: Install asyncio as specified (or v3.4.3)
      run: pip install ${{ matrix.rev-dep.asyncio_dependency_specifier }}

    - name: Install other deps
      run: pip install ${{ matrix.rev-dep.deps }}

    - name: Install ${{ matrix.rev-dep.package_name }} from pypi
      run: pip install ${{ matrix.rev-dep.package_name }}

    - name: Run pytest
      working-directory: .
      # timeout-minutes: 1
      run: pytest
